<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Talk Timer">
<title>Talk Timer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
  :root {
    --yellow: #FFD000;
    --red: #E00000;
    --panel: #141414;
    --line: #2c2c2c;
    --muted: #8a8a8a;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%;
    background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  body { touch-action: manipulation; }
  button { font: inherit; cursor: pointer; }

  .screen { position: fixed; inset: 0; display: none; }
  .screen.active { display: flex; }

  /* ---------- Setup screen ---------- */
  #setup {
    flex-direction: column; align-items: center;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  }
  .panel { width: 100%; max-width: 620px; margin: auto 0; }
  h1 {
    margin: 0 0 8px; font-size: 14px; font-weight: 700;
    letter-spacing: .22em; text-transform: uppercase; color: var(--muted);
  }
  .label {
    margin: 28px 0 10px; font-size: 13px; font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  }
  .presets { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .presets button, .num {
    background: var(--panel); color: #fff;
    border: 1px solid var(--line); border-radius: 12px;
    font-weight: 650; font-variant-numeric: tabular-nums;
  }
  .presets button { font-size: 24px; padding: 18px 0; }
  .presets button small { display: block; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .1em; margin-top: 2px; }
  .presets button.selected { background: #fff; color: #000; border-color: #fff; }
  .presets button.selected small { color: #555; }

  .custom { display: flex; align-items: center; gap: 10px; }
  .custom .unit { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; color: var(--muted); margin: 0 4px; }
  .step {
    width: 64px; height: 64px; flex: none;
    background: var(--panel); color: #fff;
    border: 1px solid var(--line); border-radius: 12px;
    font-size: 34px; font-weight: 500; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation;
  }
  .step:active { background: #fff; color: #000; }
  .secrow { margin-top: 10px; }
  .secrow .step { width: 44px; height: 44px; font-size: 24px; border-radius: 10px; }
  .secrow .num { width: 72px; font-size: 20px; padding: 8px 4px; }
  .linkbtn {
    margin-top: 10px; padding: 4px 0;
    background: none; border: none; color: var(--muted);
    font-size: 14px; font-weight: 500;
  }
  .linkbtn:active { color: #fff; }
  .num {
    width: 104px; padding: 12px 8px; text-align: center; font-size: 30px;
    -webkit-user-select: text; user-select: text;
    -moz-appearance: textfield; appearance: textfield;
  }
  .num::-webkit-outer-spin-button, .num::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .num:focus { outline: 2px solid #fff; outline-offset: 1px; }

  .warns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .warn {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 14px;
  }
  .warn .dot { width: 18px; height: 18px; border-radius: 50%; flex: none; }
  .warn .text { flex: 1; font-size: 15px; color: #ddd; }
  .warn .num { width: 76px; font-size: 22px; padding: 8px 4px; }

  #start {
    width: 100%; margin-top: 32px; padding: 22px 0;
    background: #fff; color: #000; border: none; border-radius: 14px;
    font-size: 24px; font-weight: 700; letter-spacing: .04em;
  }
  #start:active { transform: scale(.99); }
  .error { color: var(--red); font-size: 14px; min-height: 20px; margin-top: 10px; }
  .hint { color: #555; font-size: 13px; line-height: 1.5; margin-top: 18px; text-align: center; }

  @media (hover: none) { .hint .keys { display: none; } }

  /* Phones, portrait */
  @media (max-width: 480px) {
    .presets { gap: 6px; }
    .presets button { font-size: 20px; padding: 12px 0; border-radius: 10px; }
    .presets button small { font-size: 9px; }
    .label { margin: 20px 0 8px; font-size: 12px; }
    .num { width: 88px; font-size: 26px; padding: 10px 6px; }
    .step { width: 56px; height: 56px; font-size: 30px; }
    .warns { grid-template-columns: 1fr; gap: 8px; }
    .warn .num { width: 68px; font-size: 20px; }
    #start { margin-top: 24px; padding: 18px 0; font-size: 22px; }
  }
  /* Phones, landscape */
  @media (max-height: 500px) {
    .label { margin: 14px 0 6px; }
    .presets button { padding: 8px 0; font-size: 20px; }
    .num { padding: 6px; font-size: 22px; }
    .step { width: 46px; height: 46px; font-size: 26px; }
    .warn { padding: 6px 12px; }
    .warn .num { font-size: 18px; padding: 4px; }
    #start { margin-top: 16px; padding: 12px 0; font-size: 20px; }
    .hint { margin-top: 10px; }
  }

  /* ---------- Run screen ---------- */
  #run {
    align-items: center; justify-content: center;
    background: #000; color: #fff;
    transition: background-color .35s, color .35s;
  }
  #run.yellow { background: var(--yellow); color: #000; }
  #run.red    { background: var(--red);    color: #fff; }
  #run.done   { animation: flash 1s steps(1, end) infinite; }
  @keyframes flash {
    0%   { background: var(--red); color: #fff; }
    50%  { background: #000;       color: var(--red); }
  }

  #clock {
    font-weight: 700; font-variant-numeric: tabular-nums;
    font-size: min(31vw, 62vh); line-height: 1; letter-spacing: -0.02em;
    transition: opacity .2s;
  }
  #run.paused #clock { opacity: .55; }

  #status {
    position: absolute; left: 0; right: 0; top: calc(22px + env(safe-area-inset-top));
    text-align: center; font-weight: 700;
    font-size: clamp(13px, 2vw, 22px); letter-spacing: .28em;
    opacity: 0; transition: opacity .2s;
  }
  #run.paused #status { opacity: .75; }

  #controls {
    position: absolute; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
    width: max-content; max-width: calc(100% - 32px);
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  #run.show-controls #controls { opacity: 1; pointer-events: auto; }
  #controls button {
    background: rgba(0,0,0,.6); color: #fff;
    border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
    padding: 14px 22px; font-size: 17px; font-weight: 600; white-space: nowrap;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  #run.yellow #controls button { background: rgba(0,0,0,.85); }
  @media (max-width: 480px), (max-height: 500px) {
    #controls { gap: 8px; }
    #controls button { padding: 10px 16px; font-size: 15px; }
  }
</style>
</head>
<body>

<section id="setup" class="screen active">
  <div class="panel">
    <h1>Talk Timer</h1>

    <div class="label">Talk length</div>
    <div class="presets" id="presets"></div>

    <div class="label">Custom</div>
    <div class="custom">
      <button type="button" class="step" id="minDown" aria-label="One minute less">&minus;</button>
      <input id="min" class="num" type="number" inputmode="numeric" min="1" max="99" step="1" aria-label="Minutes">
      <button type="button" class="step" id="minUp" aria-label="One minute more">+</button>
      <span class="unit">min</span>
    </div>
    <div class="custom secrow" id="secRow" hidden>
      <button type="button" class="step" id="secDown" aria-label="Fifteen seconds less">&minus;</button>
      <input id="sec" class="num" type="number" inputmode="numeric" min="0" max="59" step="1" aria-label="Seconds">
      <button type="button" class="step" id="secUp" aria-label="Fifteen seconds more">+</button>
      <span class="unit">sec</span>
    </div>
    <button type="button" class="linkbtn" id="secToggle">+ Add seconds</button>

    <div class="label">Warnings (minutes remaining)</div>
    <div class="warns">
      <label class="warn">
        <span class="dot" style="background:var(--yellow)"></span>
        <span class="text">Yellow at</span>
        <input id="yellowAt" class="num" type="number" inputmode="decimal" min="0" max="99" step="0.5" aria-label="Yellow warning, minutes remaining">
      </label>
      <label class="warn">
        <span class="dot" style="background:var(--red)"></span>
        <span class="text">Red at</span>
        <input id="redAt" class="num" type="number" inputmode="decimal" min="0" max="99" step="0.5" aria-label="Red warning, minutes remaining">
      </label>
    </div>

    <button id="start">Ready</button>
    <div class="error" id="error"></div>
    <div class="hint">Tap the timer to start or pause.<span class="keys"> Keyboard: Space start/pause · R restart · F fullscreen · Esc setup.</span></div>
  </div>
</section>

<section id="run" class="screen">
  <div id="status">TAP TO START</div>
  <div id="clock">12:00</div>
  <div id="controls">
    <button id="pauseBtn">Start</button>
    <button id="restartBtn">Restart</button>
    <button id="setupBtn">Setup</button>
    <button id="fsBtn">Fullscreen</button>
  </div>
</section>

<script>
(() => {
  'use strict';

  const PRESETS = [7, 10, 12, 15, 20];                  // minutes
  const DEFAULTS = { min: 12, sec: 0, yellowAt: 3, redAt: 1 };
  const MIN_MAX = 99;
  const SEC_STEP = 15;
  const STORE_KEY = 'talk-timer-settings-v1';
  const CONTROLS_HIDE_MS = 3000;

  const $ = (id) => document.getElementById(id);
  const ui = {
    setup: $('setup'), run: $('run'), presets: $('presets'),
    min: $('min'), minDown: $('minDown'), minUp: $('minUp'),
    sec: $('sec'), secDown: $('secDown'), secUp: $('secUp'), secRow: $('secRow'), secToggle: $('secToggle'),
    yellowAt: $('yellowAt'), redAt: $('redAt'),
    start: $('start'), error: $('error'),
    clock: $('clock'), status: $('status'),
    pauseBtn: $('pauseBtn'), restartBtn: $('restartBtn'), setupBtn: $('setupBtn'), fsBtn: $('fsBtn'),
  };

  // ---------- Settings (localStorage is best effort; private modes may block it) ----------
  function loadSettings() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
      return Object.assign({}, DEFAULTS, saved);
    } catch (e) { return Object.assign({}, DEFAULTS); }
  }
  function saveSettings(s) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) { /* ignore */ }
  }

  let settings = loadSettings();

  // ---------- Setup screen ----------
  PRESETS.forEach((m) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.min = m;
    b.innerHTML = `${m}<small>MIN</small>`;
    b.addEventListener('click', () => {
      ui.min.value = m;
      setSecondsOpen(false);
      markPreset();
    });
    ui.presets.appendChild(b);
  });

  function markPreset() {
    const m = Number(ui.min.value), s = secondsValue();
    for (const b of ui.presets.children) {
      b.classList.toggle('selected', s === 0 && Number(b.dataset.min) === m);
    }
  }

  function fillSetup() {
    ui.min.value = settings.min;
    ui.sec.value = pad2(settings.sec || 0);
    setSecondsOpen((settings.sec || 0) > 0);
    ui.yellowAt.value = settings.yellowAt;
    ui.redAt.value = settings.redAt;
    markPreset();
  }

  ui.min.addEventListener('input', markPreset);

  // Seconds are a secondary option, hidden until requested.
  const pad2 = (n) => String(n).padStart(2, '0');
  const secondsOpen = () => !ui.secRow.hidden;
  const secondsValue = () => secondsOpen() ? Math.floor(Number(ui.sec.value) || 0) : 0;
  const minMinutes = () => secondsOpen() ? 0 : 1;
  function setSecondsOpen(open) {
    ui.secRow.hidden = !open;
    ui.secToggle.textContent = open ? 'Remove seconds' : '+ Add seconds';
    if (!open) {
      ui.sec.value = '00';
      if (Number(ui.min.value) < 1) ui.min.value = 1;
    }
    markPreset();
  }
  ui.secToggle.addEventListener('click', () => setSecondsOpen(!secondsOpen()));
  ui.sec.addEventListener('input', markPreset);
  ui.sec.addEventListener('blur', () => {
    ui.sec.value = pad2(Math.min(59, Math.max(0, Math.floor(Number(ui.sec.value) || 0))));
  });

  // Stepper buttons. Holding a button repeats the step.
  function stepMinutes(delta) {
    const cur = Math.floor(Number(ui.min.value) || 0);
    ui.min.value = Math.min(MIN_MAX, Math.max(minMinutes(), cur + delta));
    markPreset();
  }
  function stepSeconds(delta) {
    const cur = Math.floor(Number(ui.sec.value) || 0);
    ui.sec.value = pad2(Math.min(59, Math.max(0, cur + delta)));
    markPreset();
  }
  function bindStepper(btn, step) {
    let holdTimer = null, repeatTimer = null;
    const stop = () => { clearTimeout(holdTimer); clearInterval(repeatTimer); };
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      step();
      stop();
      holdTimer = setTimeout(() => { repeatTimer = setInterval(step, 90); }, 450);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => btn.addEventListener(ev, stop));
    btn.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); step(); }
    });
  }
  bindStepper(ui.minDown, () => stepMinutes(-1));
  bindStepper(ui.minUp, () => stepMinutes(+1));
  bindStepper(ui.secDown, () => stepSeconds(-SEC_STEP));
  bindStepper(ui.secUp, () => stepSeconds(+SEC_STEP));

  function readSetup() {
    const min = Math.floor(Number(ui.min.value) || 0);
    const sec = secondsValue();
    const yellowAt = Math.max(0, Number(ui.yellowAt.value) || 0);
    const redAt = Math.max(0, Number(ui.redAt.value) || 0);
    if (min < 0 || min > MIN_MAX || sec < 0 || sec > 59) return { error: 'Use 0–99 minutes and 0–59 seconds.' };
    if (min * 60 + sec <= 0) return { error: 'Set a length greater than zero.' };
    if (redAt > yellowAt && yellowAt > 0) return { error: 'Red warning should come after yellow (smaller number).' };
    return { min, sec, yellowAt, redAt };
  }

  ui.start.addEventListener('click', () => {
    const s = readSetup();
    if (s.error) { ui.error.textContent = s.error; return; }
    ui.error.textContent = '';
    settings = s;
    saveSettings(settings);
    enterFullscreen();
    showRun();
  });

  // ---------- Timer ----------
  // The countdown stores a wall-clock end time, so the display stays correct
  // if the browser throttles timers or the device briefly sleeps.
  let durationMs = 0, remainingMs = 0, endTime = 0;
  let running = false, finished = false, started = false;
  let tickId = null, hideTimer = null, lastText = '', lastPhase = '';

  function format(ms) {
    const total = Math.ceil(ms / 1000);
    const m = Math.floor(total / 60), s = total % 60;
    return `${m}:${String(s).padStart(2, '0')}`;
  }

  function phaseFor(ms) {
    const secsShown = Math.ceil(ms / 1000);
    if (ms <= 0) return 'done';
    if (settings.redAt > 0 && secsShown <= settings.redAt * 60) return 'red';
    if (settings.yellowAt > 0 && secsShown <= settings.yellowAt * 60) return 'yellow';
    return 'normal';
  }

  function render() {
    const text = format(remainingMs);
    if (text !== lastText) { ui.clock.textContent = text; lastText = text; }
    const phase = phaseFor(remainingMs);
    if (phase !== lastPhase) {
      ui.run.classList.toggle('yellow', phase === 'yellow');
      ui.run.classList.toggle('red', phase === 'red');
      ui.run.classList.toggle('done', phase === 'done');
      lastPhase = phase;
    }
    ui.run.classList.toggle('paused', !running && !finished);
    ui.status.textContent = started ? 'PAUSED' : 'TAP TO START';
    ui.pauseBtn.textContent = running ? 'Pause' : (started ? 'Resume' : 'Start');
    ui.pauseBtn.hidden = finished;
  }

  function tick() {
    remainingMs = Math.max(0, endTime - Date.now());
    if (remainingMs <= 0) finish();
    render();
  }

  function start() {
    if (running || finished) return;
    endTime = Date.now() + remainingMs;
    running = true; started = true;
    tickId = setInterval(tick, 100);
    tick();
    scheduleHideControls();
  }

  function pause() {
    if (!running) return;
    remainingMs = Math.max(0, endTime - Date.now());
    running = false;
    clearInterval(tickId);
    render();
    showControls(false);
  }

  function finish() {
    running = false; finished = true;
    clearInterval(tickId);
    remainingMs = 0;
  }

  function reset() {
    clearInterval(tickId);
    running = false; finished = false; started = false;
    durationMs = (settings.min * 60 + (settings.sec || 0)) * 1000;
    remainingMs = durationMs;
    lastText = ''; lastPhase = '';
    render();
    showControls(false);
  }

  function toggle() { running ? pause() : start(); }

  // ---------- Controls overlay ----------
  function showControls(autoHide) {
    ui.run.classList.add('show-controls');
    clearTimeout(hideTimer);
    if (autoHide) scheduleHideControls();
  }
  function scheduleHideControls() {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      if (running) ui.run.classList.remove('show-controls');
    }, CONTROLS_HIDE_MS);
  }

  ui.run.addEventListener('click', (e) => {
    if (e.target.closest('#controls')) return;
    if (finished) { showControls(false); return; }
    toggle();
    if (running) showControls(true);
  });
  ui.pauseBtn.addEventListener('click', toggle);
  ui.restartBtn.addEventListener('click', reset);
  ui.setupBtn.addEventListener('click', showSetup);
  ui.fsBtn.addEventListener('click', toggleFullscreen);

  // ---------- Screens ----------
  function showRun() {
    ui.setup.classList.remove('active');
    ui.run.classList.add('active');
    reset();
    requestWakeLock();
  }
  function showSetup() {
    clearInterval(tickId);
    running = false;
    ui.run.classList.remove('active', 'show-controls', 'yellow', 'red', 'done', 'paused');
    ui.setup.classList.add('active');
    fillSetup();
    releaseWakeLock();
  }

  // ---------- Keyboard ----------
  document.addEventListener('keydown', (e) => {
    if (!ui.run.classList.contains('active')) {
      if (e.key === 'Enter') ui.start.click();
      return;
    }
    if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); if (!finished) toggle(); }
    else if (e.key === 'r' || e.key === 'R') reset();
    else if (e.key === 'f' || e.key === 'F') toggleFullscreen();
    else if (e.key === 'Escape' && !isFullscreen()) showSetup();
  });

  // ---------- Fullscreen ----------
  const docEl = document.documentElement;
  const canFullscreen = !!(docEl.requestFullscreen || docEl.webkitRequestFullscreen);
  const isStandalone = window.matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches
    || window.navigator.standalone === true;
  ui.fsBtn.hidden = !canFullscreen || isStandalone;

  function isFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function enterFullscreen() {
    if (!canFullscreen || isStandalone || isFullscreen()) return;
    const req = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
    try { const p = req.call(docEl); if (p && p.catch) p.catch(() => {}); } catch (e) { /* ignore */ }
  }
  function toggleFullscreen() {
    if (!canFullscreen) return;
    if (isFullscreen()) {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      try { const p = exit.call(document); if (p && p.catch) p.catch(() => {}); } catch (e) { /* ignore */ }
    } else {
      enterFullscreen();
    }
  }
  const syncFsLabel = () => { ui.fsBtn.textContent = isFullscreen() ? 'Exit fullscreen' : 'Fullscreen'; };
  document.addEventListener('fullscreenchange', syncFsLabel);
  document.addEventListener('webkitfullscreenchange', syncFsLabel);

  // ---------- Screen Wake Lock (keeps iPad/laptop displays on while the timer screen is open) ----------
  let wakeLock = null;
  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (e) { wakeLock = null; }
  }
  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  }
  // Browsers drop the lock when the page is hidden. Re-acquire on return.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      if (ui.run.classList.contains('active')) requestWakeLock();
      if (running) tick();
    }
  });

  // ---------- Offline support ----------
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  fillSetup();
})();
</script>
</body>
</html>
